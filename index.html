<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dandiya Match</title>
<style>
:root{--bg:#fff7ec;--card:#fff;--tx:#2b1a12;--mu:#7a6355;--ac:#c2410c;--bd:#f0d9bd;--ok:#15803d;--no:#9ca3af;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e130d;--card:#2a1c14;--tx:#f8eadc;--mu:#c4a994;--ac:#fb923c;--bd:#4a3425;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#1e130d;--card:#2a1c14;--tx:#f8eadc;--mu:#c4a994;--ac:#fb923c;--bd:#4a3425;--ok:#4ade80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{margin:8px 0 2px;font-size:26px;color:var(--ac)}p.s{margin:0 0 14px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:10px;background:var(--bg);color:var(--tx);width:100%}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>*{flex:1}
nav{display:flex;gap:8px;margin-bottom:14px}nav button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}nav button.on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.p{text-align:center}.p img,.av{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:36px}
.p b{display:block;margin:6px 0 2px}.tag{display:inline-block;font-size:12px;color:var(--ok);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats div{text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:12px}.stats b{display:block;font-size:22px;color:var(--ac)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--no)}.dot.on{background:var(--ok)}
.err{color:#dc2626;font-size:13px;min-height:18px}.hide{display:none}
</style></head><body><main>
<h1>🪔 Dandiya Match</h1><p class="s">Find your dandiya partner for the night</p>
<div id="msg" class="card hide"></div>
<nav id="nav" class="hide"><button data-t="matches" class="on">Matches</button><button data-t="me">My profile</button><button data-t="admin" id="adm" class="hide">Admin</button></nav>

<section id="signup" class="card hide">
<b>Join the dandiya night</b>
<label>Name</label><input id="n" maxlength="40" autocomplete="name">
<div class="row"><div><label>Age</label><input id="a" type="number" min="18" max="80" inputmode="numeric"></div>
<div><label>I am</label><select id="g"><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></div></div>
<label>Phone number</label><input id="ph" type="tel" inputmode="tel" maxlength="15" autocomplete="tel">
<label>Photo</label><input id="f" type="file" accept="image/*">
<div class="err" id="e"></div><button id="sv">Save &amp; find matches</button>
</section>

<section id="matches" class="hide">
<div class="card"><div class="row">
<div><label>Show</label><select id="fg"><option value="">Everyone</option><option>Female</option><option>Male</option><option>Other</option></select></div>
<div><label>Min age</label><input id="fa" type="number" value="18" inputmode="numeric"></div>
<div><label>Max age</label><input id="fb" type="number" value="60" inputmode="numeric"></div></div></div>
<div id="list" class="grid"></div><p id="empty" class="s hide">No one matches these filters yet. Check back soon!</p>
</section>

<section id="admin" class="hide">
<div class="stats" id="st"></div><div class="card tw" style="margin-top:12px"><table><thead><tr><th>Status</th><th>Name</th><th>Age</th><th>Phone</th><th>Device</th><th>Last seen</th></tr></thead><tbody id="tb"></tbody></table></div>
</section>

<script>
(async()=>{
const $=s=>document.querySelector(s),show=(e,v)=>e.classList.toggle('hide',!v);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null,user=null;
try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
if(!db||!user){const m=$('#msg');show(m,true);m.textContent='Please open this page signed in to Claude to join or manage the event.';return}
const me=await user.id(),owner=user.isOwner();
let profiles={},contacts={},likes={},mine=null,tab='matches';
const ua=navigator.userAgent,dev=(/Mobi|Android|iPhone/.test(ua)?'Mobile':'Desktop')+' · '+(/Edg/.test(ua)?'Edge':/Chrome/.test(ua)?'Chrome':/Safari/.test(ua)?'Safari':/Firefox/.test(ua)?'Firefox':'Browser');
const col=(n,fn)=>db.collection(n).onSnapshot(s=>{const o={};s.docs.forEach(d=>{if(d.exists!==false)o[d.id]=d.data()});fn(o);render()},()=>{});
col('profiles',o=>{profiles=o;mine=o[me]||null});
col('likes',o=>likes=o);
if(owner){col('contacts',o=>contacts=o);show($('#adm'),true)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
['fg','fa','fb'].forEach(i=>$('#'+i).oninput=render);

const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=240,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),m=Math.min(i.width,i.height);x.drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',.7))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)});

$('#sv').onclick=async()=>{
 const n=$('#n').value.trim(),a=+$('#a').value,g=$('#g').value,ph=$('#ph').value.replace(/[\s-]/g,''),f=$('#f').files[0],e=$('#e');
 if(n.length<2)return e.textContent='Enter your name';
 if(!(a>=18&&a<=80))return e.textContent='Age must be 18 or above';
 if(!g)return e.textContent='Select an option';
 if(!/^\+?\d{10,14}$/.test(ph))return e.textContent='Enter a valid phone number';
 if(!f&&!(mine&&mine.photo))return e.textContent='Please upload a photo';
 e.textContent='';$('#sv').disabled=true;
 try{
  const photo=f?await shrink(f):mine.photo;
  await db.doc('profiles/'+me).set({name:n,age:a,gender:g,photo,device:dev,lastSeen:Date.now()});
  await db.doc('contacts/'+me).set({name:n,phone:ph});
  tab='matches';
 }catch(x){e.textContent='Could not save. Please try again.'}
 $('#sv').disabled=false;render();
};

async function like(id){const t=new Set((likes[me]||{}).to||[]);t.has(id)?t.delete(id):t.add(id);try{await db.doc('likes/'+me).set({to:[...t]})}catch(e){}}
const online=p=>p.lastSeen&&Date.now()-p.lastSeen<75000;
function render(){
 const has=!!mine;
 show($('#nav'),has);show($('#signup'),!has||tab==='me');
 show($('#matches'),has&&tab==='matches');show($('#admin'),owner&&tab==='admin');
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(has&&tab==='me'&&!$('#n').value){$('#n').value=mine.name;$('#a').value=mine.age;$('#g').value=mine.gender}
 if(has&&tab==='matches'){
  const g=$('#fg').value,lo=+$('#fa').value||18,hi=+$('#fb').value||99,my=new Set((likes[me]||{}).to||[]);
  const L=Object.entries(profiles).filter(([id,p])=>id!==me&&(!g||p.gender===g)&&p.age>=lo&&p.age<=hi);
  $('#list').innerHTML=L.map(([id,p])=>{const m=my.has(id)&&((likes[id]||{}).to||[]).includes(me);
   return `<div class="card p" style="margin:0">${p.photo?`<img src="${esc(p.photo)}" alt="">`:'<div class="av">🪔</div>'}<b>${esc(p.name)}, ${esc(p.age)}</b>${m?'<span class="tag">💛 It\'s a match! The organiser will connect you</span>':''}<button class="${my.has(id)?'g':''}" data-l="${esc(id)}" style="margin-top:8px">${my.has(id)?'Liked ✓':'Be my partner'}</button></div>`}).join('');
  $('#list').querySelectorAll('button').forEach(b=>b.onclick=()=>like(b.dataset.l));
  show($('#empty'),!L.length);
 }
 if(owner&&tab==='admin'){
  const E=Object.entries(profiles),on=E.filter(([,p])=>online(p)).length;
  let mm=0;E.forEach(([a])=>((likes[a]||{}).to||[]).forEach(b=>{if(a<b&&((likes[b]||{}).to||[]).includes(a))mm++}));
  $('#st').innerHTML=[['Users',E.length],['Online',on],['Offline',E.length-on],['Mutual matches',mm]].map(([k,v])=>`<div><b>${v}</b>${k}</div>`).join('');
  $('#tb').innerHTML=E.sort((x,y)=>(y[1].lastSeen||0)-(x[1].lastSeen||0)).map(([id,p])=>`<tr><td><span class="dot ${online(p)?'on':''}"></span>${online(p)?'Online':'Offline'}</td><td>${esc(p.name)}</td><td>${esc(p.age)}</td><td>${esc((contacts[id]||{}).phone||'-')}</td><td>${esc(p.device||'-')}</td><td>${p.lastSeen?new Date(p.lastSeen).toLocaleString():'-'}</td></tr>`).join('');
 }
}
render();
setInterval(()=>{if(mine&&!document.hidden)db.doc('profiles/'+me).update({lastSeen:Date.now(),device:dev}).catch(()=>{});if(owner&&tab==='admin')render()},30000);
})();
</script></main></body></html>
