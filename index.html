<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dandiya Match 🪔</title>
<style>
  :root{--bg:#fff7ed;--card:#fff;--ink:#3b1d0a;--accent:#d9480f;--muted:#8a6a55}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(90deg,#d9480f,#f59f00);color:#fff;padding:18px;text-align:center;font-size:22px;font-weight:700}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
  label{display:block;margin:10px 0 4px;font-size:14px;color:var(--muted)}
  input{width:100%;padding:10px;border:1px solid #e5cdb8;border-radius:8px;font-size:16px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:16px;cursor:pointer}
  button.alt{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  button:disabled{opacity:.5}
  .row{display:flex;gap:10px;align-items:center}
  .person{display:flex;gap:12px;align-items:center}
  .person img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#eee}
  .person .grow{flex:1}
  .tag{display:inline-block;background:#ffe8cc;border-radius:99px;padding:2px 10px;font-size:13px}
  .hidden{display:none}
  #preview{width:96px;height:96px;border-radius:50%;object-fit:cover;margin-top:8px}
  a.wa{color:#fff;background:#2f9e44;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<header>🪔 Dandiya Match</header>
<main>
  <!-- PAGE 1: signup -->
  <section id="signup" class="card hidden">
    <h2>Create your profile</h2>
    <label>Name</label><input id="name" maxlength="40">
    <label>Age</label><input id="age" type="number" min="14" max="90">
    <label>Phone number</label><input id="phone" type="tel" placeholder="+91XXXXXXXXXX">
    <label>Upload photo</label><input id="photo" type="file" accept="image/*">
    <img id="preview" class="hidden" alt="">
    <p id="err" style="color:#c92a2a"></p>
    <button id="save">Find my dandiya partner</button>
  </section>

  <!-- PAGE 2: matches -->
  <section id="app" class="hidden">
    <div class="card">
      <b id="hello"></b>
      <div class="row" style="margin-top:10px">
        <span>Age</span>
        <input id="amin" type="number" value="18" style="width:80px">
        <span>to</span>
        <input id="amax" type="number" value="35" style="width:80px">
      </div>
    </div>
    <h3>💞 Your matches (both interested)</h3>
    <div id="matches"></div>
    <h3>People to meet</h3>
    <div id="people"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $ = id => document.getElementById(id);
let me = null, myDoc = null, users = [], iLike = new Set(), likedMe = new Set(), photoData = "";

// Resize photo to ~300px JPEG so it fits in a Firestore document
function resize(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = 300 / Math.max(img.width, img.height, 300);
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
$("photo").onchange = async e => {
  if (!e.target.files[0]) return;
  photoData = await resize(e.target.files[0]);
  $("preview").src = photoData; $("preview").classList.remove("hidden");
};

$("save").onclick = async () => {
  const name = $("name").value.trim(), age = +$("age").value, phone = $("phone").value.trim();
  if (!name || !age || age < 14 || age > 90 || phone.replace(/\D/g, "").length < 10 || !photoData){
    $("err").textContent = "Please fill name, a valid age, phone number and upload a photo."; return;
  }
  $("save").disabled = true;
  const batch = db.batch();
  batch.set(db.doc("users/" + me.uid), { name, age, photo: photoData, lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
  batch.set(db.doc("phones/" + me.uid), { phone });
  await batch.commit();
  myDoc = { name, age };
  start();
};

function heartbeat(){
  if (myDoc) db.doc("users/" + me.uid).update({ lastSeen: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
}

function start(){
  $("signup").classList.add("hidden"); $("app").classList.remove("hidden");
  $("hello").textContent = "Hi " + myDoc.name + "! Showing people logged in to the site.";
  heartbeat(); setInterval(heartbeat, 30000);
  db.collection("users").onSnapshot(s => { users = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); });
  db.collection("likes").where("from", "==", me.uid).onSnapshot(s => { iLike = new Set(s.docs.map(d => d.data().to)); render(); });
  db.collection("likes").where("to", "==", me.uid).onSnapshot(s => { likedMe = new Set(s.docs.map(d => d.data().from)); render(); });
  $("amin").oninput = $("amax").oninput = render;
}

function card(u, extra){
  return `<div class="card person"><img src="${u.photo}" alt="">
    <div class="grow"><b>${esc(u.name)}</b> <span class="tag">${u.age} yrs</span><br>${extra}</div></div>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

async function render(){
  const lo = +$("amin").value || 0, hi = +$("amax").value || 99;
  const others = users.filter(u => u.id !== me.uid);
  const mutual = others.filter(u => iLike.has(u.id) && likedMe.has(u.id));
  const rest = others.filter(u => !mutual.includes(u) && u.age >= lo && u.age <= hi);

  $("matches").innerHTML = mutual.length ? "" : "<p>No matches yet — show interest in someone!</p>";
  for (const u of mutual){
    let phone = "";
    try { phone = (await db.doc("phones/" + u.id).get()).data().phone; } catch(e){}
    const num = phone.replace(/\D/g, "");
    $("matches").insertAdjacentHTML("beforeend", card(u, `<a class="wa" href="https://wa.me/${num}" target="_blank">Chat on WhatsApp</a> ${esc(phone)}`));
  }
  $("people").innerHTML = rest.length ? "" : "<p>Nobody in this age range yet.</p>";
  rest.forEach(u => $("people").insertAdjacentHTML("beforeend",
    card(u, iLike.has(u.id) ? `<button class="alt" data-u="${u.id}" data-un="1">Interested ✓ (undo)</button>` : `<button data-u="${u.id}">I'm interested 💛</button>`)));
}

document.addEventListener("click", async e => {
  const id = e.target.dataset && e.target.dataset.u; if (!id) return;
  const ref = db.doc("likes/" + me.uid + "_" + id);
  e.target.dataset.un ? await ref.delete() : await ref.set({ from: me.uid, to: id });
});

auth.signInAnonymously().then(async cred => {
  me = cred.user;
  const d = await db.doc("users/" + me.uid).get();
  if (d.exists){ myDoc = d.data(); start(); } else $("signup").classList.remove("hidden");
}).catch(e => { document.body.insertAdjacentHTML("beforeend", "<p style='padding:20px'>Setup error: " + e.message + "</p>"); });
</script>
</body>
</html>
