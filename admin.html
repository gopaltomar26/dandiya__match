<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Panel</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
  header{padding:16px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
  main{max-width:900px;margin:0 auto;padding:16px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:#1e293b;border-radius:12px;padding:16px}
  .stat b{font-size:28px;display:block}
  table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden}
  th,td{padding:10px;text-align:left;border-bottom:1px solid #334155;font-size:14px}
  img{width:40px;height:40px;border-radius:50%;object-fit:cover}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  .on{background:#22c55e}.off{background:#64748b}
  button{background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
  button.del{background:#ef4444;padding:5px 10px}
  input{padding:8px;border-radius:8px;border:0;margin-bottom:12px;width:100%}
  .center{text-align:center;margin-top:20vh}.hidden{display:none}
  .wrap{overflow-x:auto}
</style>
</head>
<body>
<div id="login" class="center">
  <h2>Admin Panel</h2>
  <button id="gbtn">Sign in with Google</button>
  <p id="msg" style="color:#f87171"></p>
</div>

<div id="panel" class="hidden">
  <header><b>Dandiya Match — Admin</b><button id="out">Sign out</button></header>
  <main>
    <div class="stats">
      <div class="stat">Total users<b id="sTotal">0</b></div>
      <div class="stat">🟢 Online<b id="sOn">0</b></div>
      <div class="stat">⚪ Offline<b id="sOff">0</b></div>
      <div class="stat">💞 Interests sent<b id="sLikes">0</b></div>
      <div class="stat">🤝 Mutual matches<b id="sMatch">0</b></div>
    </div>
    <input id="q" placeholder="Search by name...">
    <div class="wrap"><table>
      <thead><tr><th></th><th>Name</th><th>Age</th><th>Phone</th><th>Status</th><th>Last seen</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
let users = [], phones = {}, unsubs = [];

$("gbtn").onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => $("msg").textContent = e.message);
$("out").onclick = () => auth.signOut();

auth.onAuthStateChanged(u => {
  unsubs.forEach(f => f()); unsubs = [];
  if (u && !u.isAnonymous && u.email === window.OWNER_EMAIL){
    $("login").classList.add("hidden"); $("panel").classList.remove("hidden"); load();
  } else {
    $("panel").classList.add("hidden"); $("login").classList.remove("hidden");
    if (u && !u.isAnonymous){ $("msg").textContent = "Access denied: this account is not the owner."; auth.signOut(); }
  }
});

function load(){
  unsubs.push(db.collection("users").onSnapshot(s => { users = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }));
  unsubs.push(db.collection("phones").onSnapshot(s => { phones = {}; s.docs.forEach(d => phones[d.id] = d.data().phone); render(); }));
  unsubs.push(db.collection("likes").onSnapshot(s => {
    const set = new Set(s.docs.map(d => d.id));
    $("sLikes").textContent = set.size;
    $("sMatch").textContent = s.docs.filter(d => { const { from, to } = d.data(); return set.has(to + "_" + from) && from < to; }).length;
  }));
  setInterval(render, 15000);
}

const isOn = u => u.lastSeen && Date.now() - u.lastSeen.toMillis() < 70000;

function render(){
  const q = $("q").value.toLowerCase();
  const on = users.filter(isOn).length;
  $("sTotal").textContent = users.length; $("sOn").textContent = on; $("sOff").textContent = users.length - on;
  $("rows").innerHTML = users.filter(u => u.name.toLowerCase().includes(q)).map(u => `
    <tr><td><img src="${u.photo}" alt=""></td><td>${esc(u.name)}</td><td>${u.age}</td>
    <td>${esc(phones[u.id] || "-")}</td>
    <td><span class="dot ${isOn(u) ? "on" : "off"}"></span>${isOn(u) ? "Online" : "Offline"}</td>
    <td>${u.lastSeen ? u.lastSeen.toDate().toLocaleString() : "-"}</td>
    <td><button class="del" onclick="del('${u.id}')">Remove</button></td></tr>`).join("");
}
$("q").oninput = render;

async function del(id){
  if (!confirm("Remove this user?")) return;
  const b = db.batch(); b.delete(db.doc("users/" + id)); b.delete(db.doc("phones/" + id)); await b.commit();
}
</script>
</body>
</html>
